<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Typing Counter</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f2;
        --panel: #ffffff;
        --ink: #202124;
        --muted: #666b73;
        --line: #d8dcd2;
        --focus: #246bfe;
        --highlight: #ffe66f;
        --shadow: 0 18px 50px rgba(29, 33, 41, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(135deg, rgba(36, 107, 254, 0.08), transparent 34%),
          linear-gradient(225deg, rgba(28, 139, 102, 0.09), transparent 28%),
          var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(980px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 40px 0;
      }

      .shell {
        display: grid;
        gap: 20px;
      }

      .topbar {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 5vw, 56px);
        line-height: 0.95;
        letter-spacing: 0;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        min-width: min(420px, 100%);
      }

      .stat {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.72);
        padding: 10px 12px;
      }

      .stat span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }

      .stat strong {
        display: block;
        margin-top: 3px;
        font-size: 24px;
        line-height: 1;
      }

      .workspace {
        display: grid;
        gap: 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
        padding: 22px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      label {
        font-size: 14px;
        font-weight: 700;
      }

      .count {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-size: 13px;
      }

      .title-input,
      .content-input,
      .highlight-layer {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        font: 18px/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", monospace;
        letter-spacing: 0;
      }

      .title-input {
        display: block;
        min-height: 96px;
        padding: 12px 14px;
        resize: vertical;
        color: var(--ink);
        background: #fbfcfb;
        outline: none;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .content-wrap {
        position: relative;
        min-height: 360px;
      }

      .content-input,
      .highlight-layer {
        min-height: 360px;
        padding: 14px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .content-input {
        position: absolute;
        inset: 0;
        z-index: 2;
        resize: vertical;
        color: transparent;
        caret-color: var(--ink);
        background: transparent;
        outline: none;
      }

      .highlight-layer {
        position: absolute;
        inset: 0;
        z-index: 1;
        overflow: auto;
        pointer-events: none;
        color: var(--ink);
        background: #fbfcfb;
      }

      mark {
        border-radius: 3px;
        background: var(--highlight);
        color: inherit;
        padding: 1px 0;
      }

      .title-input:focus,
      .content-input:focus,
      .content-wrap:focus-within .highlight-layer {
        border-color: var(--focus);
        box-shadow: 0 0 0 3px rgba(36, 107, 254, 0.15);
      }

      .progress {
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: #e5e9df;
      }

      .progress span {
        display: block;
        width: var(--progress, 0%);
        height: 100%;
        background: linear-gradient(90deg, #1c8b66, #246bfe);
        transition: width 120ms ease;
      }

      @media (max-width: 760px) {
        main {
          width: min(100vw - 20px, 980px);
          padding: 16px 0;
        }

        .topbar,
        .field-header {
          align-items: stretch;
          flex-direction: column;
        }

        .summary {
          grid-template-columns: 1fr;
          min-width: 0;
        }

        .workspace {
          padding: 14px;
        }

        .title-input,
        .content-input,
        .highlight-layer {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="shell">
        <div class="topbar">
          <h1>Typing Counter</h1>
          <div class="summary" aria-live="polite">
            <div class="stat">
              <span>Title</span>
              <strong id="titleTotal">0</strong>
            </div>
            <div class="stat">
              <span>Content</span>
              <strong id="contentTotal">0</strong>
            </div>
            <div class="stat">
              <span>After 160</span>
              <strong id="overTotal">0</strong>
            </div>
          </div>
        </div>

        <section class="workspace">
          <div class="field">
            <div class="field-header">
              <label for="titleInput">Title</label>
              <span class="count"><strong id="titleInline">0</strong> characters</span>
            </div>
            <textarea
              id="titleInput"
              class="title-input"
              autocomplete="off"
              spellcheck="true"
              rows="3"
            ></textarea>
          </div>

          <div class="field">
            <div class="field-header">
              <label for="contentInput">Content</label>
              <span class="count"><strong id="contentInline">0</strong> characters</span>
            </div>
            <div class="content-wrap">
              <div id="highlightLayer" class="highlight-layer" aria-hidden="true"></div>
              <textarea id="contentInput" class="content-input" spellcheck="true"></textarea>
            </div>
            <div class="progress" aria-hidden="true">
              <span id="progressFill"></span>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script>
      const titleInput = document.querySelector("#titleInput");
      const contentInput = document.querySelector("#contentInput");
      const highlightLayer = document.querySelector("#highlightLayer");
      const progressFill = document.querySelector("#progressFill");
      const titleTotal = document.querySelector("#titleTotal");
      const titleInline = document.querySelector("#titleInline");
      const contentTotal = document.querySelector("#contentTotal");
      const contentInline = document.querySelector("#contentInline");
      const overTotal = document.querySelector("#overTotal");
      const highlightLimit = 160;

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function updateTitle() {
        const count = titleInput.value.length;
        titleTotal.textContent = count;
        titleInline.textContent = count;
        titleInput.style.height = "auto";
        titleInput.style.height = `${titleInput.scrollHeight}px`;
      }

      function updateContent() {
        const value = contentInput.value;
        const highlighted = escapeHtml(value.slice(0, highlightLimit));
        const rest = escapeHtml(value.slice(highlightLimit));
        const placeholder = value.length === 0 ? "&nbsp;" : "";

        highlightLayer.innerHTML = `${placeholder}<mark>${highlighted}</mark>${rest}`;
        contentTotal.textContent = value.length;
        contentInline.textContent = value.length;
        overTotal.textContent = Math.max(0, value.length - highlightLimit);
        progressFill.style.setProperty(
          "--progress",
          `${Math.min(100, (value.length / highlightLimit) * 100)}%`,
        );
      }

      function syncScroll() {
        highlightLayer.scrollTop = contentInput.scrollTop;
        highlightLayer.scrollLeft = contentInput.scrollLeft;
      }

      titleInput.addEventListener("input", updateTitle);
      contentInput.addEventListener("input", updateContent);
      contentInput.addEventListener("scroll", syncScroll);

      updateTitle();
      updateContent();
    </script>
  </body>
</html>
