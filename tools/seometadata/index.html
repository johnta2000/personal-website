<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Typing Counter</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f2;
        --panel: #ffffff;
        --ink: #202124;
        --muted: #666b73;
        --line: #d8dcd2;
        --focus: #246bfe;
        --highlight: #ffe66f;
        --shadow: 0 18px 50px rgba(29, 33, 41, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(135deg, rgba(36, 107, 254, 0.08), transparent 34%),
          linear-gradient(225deg, rgba(28, 139, 102, 0.09), transparent 28%),
          var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(980px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 40px 0;
      }

      .shell {
        display: grid;
        gap: 20px;
      }

      .topbar {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 5vw, 56px);
        line-height: 0.95;
        letter-spacing: 0;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        min-width: min(560px, 100%);
      }

      .stat {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.72);
        padding: 10px 12px;
      }

      .stat span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }

      .stat strong {
        display: block;
        margin-top: 3px;
        font-size: 24px;
        line-height: 1;
      }

      .workspace {
        display: grid;
        gap: 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
        padding: 22px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      label {
        font-size: 14px;
        font-weight: 700;
      }

      .count {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-size: 13px;
      }

      .title-input,
      .content-editor {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        letter-spacing: 0;
      }

      .title-input {
        font: 18px/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", monospace;
        display: block;
        min-height: 96px;
        padding: 12px 14px;
        resize: vertical;
        color: var(--ink);
        background: #fbfcfb;
        outline: none;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .content-editor {
        min-height: 360px;
        padding: 14px;
        overflow: auto;
        overflow-wrap: anywhere;
        color: var(--ink);
        background: #fbfcfb;
        font: 17px/1.55 Inter, ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
        outline: none;
      }

      mark {
        border-radius: 3px;
        background: var(--highlight);
        color: inherit;
        padding: 1px 0;
      }

      .title-input:focus,
      .content-editor:focus {
        border-color: var(--focus);
        box-shadow: 0 0 0 3px rgba(36, 107, 254, 0.15);
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .toolbar button {
        min-width: 38px;
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfb;
        color: var(--ink);
        font: 700 13px/1 Inter, ui-sans-serif, system-ui, sans-serif;
        cursor: pointer;
      }

      .toolbar button:hover,
      .toolbar button:focus {
        border-color: var(--focus);
        outline: none;
      }

      .content-editor h1,
      .content-editor h2,
      .content-editor h3,
      .content-editor p,
      .content-editor ul,
      .content-editor ol {
        margin: 0 0 12px;
      }

      .content-editor h1 {
        font-size: 34px;
        line-height: 1.12;
      }

      .content-editor h2 {
        font-size: 28px;
        line-height: 1.18;
      }

      .content-editor h3 {
        font-size: 22px;
        line-height: 1.25;
      }

      .content-editor ul,
      .content-editor ol {
        padding-left: 28px;
      }

      .content-editor li {
        margin: 4px 0;
      }

      .progress {
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: #e5e9df;
      }

      .progress span {
        display: block;
        width: var(--progress, 0%);
        height: 100%;
        background: linear-gradient(90deg, #1c8b66, #246bfe);
        transition: width 120ms ease;
      }

      @media (max-width: 760px) {
        main {
          width: min(100vw - 20px, 980px);
          padding: 16px 0;
        }

        .topbar,
        .field-header {
          align-items: stretch;
          flex-direction: column;
        }

        .summary {
          grid-template-columns: 1fr;
          min-width: 0;
        }

        .workspace {
          padding: 14px;
        }

        .title-input,
        .content-editor {
          font-size: 16px;
        }

        .content-editor h1 {
          font-size: 28px;
        }

        .content-editor h2 {
          font-size: 23px;
        }

        .content-editor h3 {
          font-size: 19px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="shell">
        <div class="topbar">
          <h1>Typing Counter</h1>
          <div class="summary" aria-live="polite">
            <div class="stat">
              <span>Title</span>
              <strong id="titleTotal">0</strong>
            </div>
            <div class="stat">
              <span>Content</span>
              <strong id="contentTotal">0</strong>
            </div>
            <div class="stat">
              <span>After 160</span>
              <strong id="overTotal">0</strong>
            </div>
            <div class="stat">
              <span>Words</span>
              <strong id="wordTotal">0</strong>
            </div>
          </div>
        </div>

        <section class="workspace">
          <div class="field">
            <div class="field-header">
              <label for="titleInput">Title</label>
              <span class="count"><strong id="titleInline">0</strong> characters</span>
            </div>
            <textarea
              id="titleInput"
              class="title-input"
              autocomplete="off"
              spellcheck="true"
              rows="3"
            ></textarea>
          </div>

          <div class="field">
            <div class="field-header">
              <label id="contentLabel" for="contentInput">Content</label>
              <span class="count">
                <strong id="contentInline">0</strong> characters ·
                <strong id="wordInline">0</strong> words
              </span>
            </div>
            <div class="toolbar" aria-label="Content formatting">
              <button type="button" data-command="formatBlock" data-value="H1" title="Heading 1">H1</button>
              <button type="button" data-command="formatBlock" data-value="H2" title="Heading 2">H2</button>
              <button type="button" data-command="formatBlock" data-value="H3" title="Heading 3">H3</button>
              <button type="button" data-command="formatBlock" data-value="P" title="Paragraph">P</button>
              <button type="button" data-command="bold" title="Bold">B</button>
              <button type="button" data-command="italic" title="Italic">I</button>
              <button type="button" data-command="insertUnorderedList" title="Bulleted list">•</button>
              <button type="button" data-command="insertOrderedList" title="Numbered list">1.</button>
            </div>
            <div
              id="contentInput"
              class="content-editor"
              contenteditable="true"
              role="textbox"
              aria-labelledby="contentLabel"
              aria-multiline="true"
              spellcheck="true"
            ></div>
            <div class="progress" aria-hidden="true">
              <span id="progressFill"></span>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script>
      const titleInput = document.querySelector("#titleInput");
      const contentInput = document.querySelector("#contentInput");
      const progressFill = document.querySelector("#progressFill");
      const titleTotal = document.querySelector("#titleTotal");
      const titleInline = document.querySelector("#titleInline");
      const contentTotal = document.querySelector("#contentTotal");
      const contentInline = document.querySelector("#contentInline");
      const overTotal = document.querySelector("#overTotal");
      const wordTotal = document.querySelector("#wordTotal");
      const wordInline = document.querySelector("#wordInline");
      const highlightLimit = 160;

      function updateTitle() {
        const count = titleInput.value.length;
        titleTotal.textContent = count;
        titleInline.textContent = count;
        titleInput.style.height = "auto";
        titleInput.style.height = `${titleInput.scrollHeight}px`;
      }

      function getTextLength(root) {
        return root.textContent.replace(/\u00a0/g, " ").length;
      }

      function getWordCount(value) {
        return value.trim().match(/\S+/g)?.length || 0;
      }

      function saveSelection(root) {
        const selection = window.getSelection();

        if (!selection.rangeCount) {
          return null;
        }

        const range = selection.getRangeAt(0);

        if (!root.contains(range.startContainer)) {
          return null;
        }

        const before = range.cloneRange();
        before.selectNodeContents(root);
        before.setEnd(range.startContainer, range.startOffset);

        return before.toString().length;
      }

      function restoreSelection(root, offset) {
        if (offset === null) {
          return;
        }

        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        let remaining = offset;
        let node = walker.nextNode();

        while (node) {
          if (remaining <= node.textContent.length) {
            const range = document.createRange();
            const selection = window.getSelection();
            range.setStart(node, remaining);
            range.collapse(true);
            selection.removeAllRanges();
            selection.addRange(range);
            return;
          }

          remaining -= node.textContent.length;
          node = walker.nextNode();
        }

        const range = document.createRange();
        const selection = window.getSelection();
        range.selectNodeContents(root);
        range.collapse(false);
        selection.removeAllRanges();
        selection.addRange(range);
      }

      function unwrapHighlights(root) {
        root.querySelectorAll("mark[data-count-highlight]").forEach((mark) => {
          mark.replaceWith(...mark.childNodes);
        });
        root.normalize();
      }

      function highlightFirstCharacters(root, limit) {
        unwrapHighlights(root);

        if (limit <= 0) {
          return;
        }

        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
          acceptNode(node) {
            return node.textContent.length
              ? NodeFilter.FILTER_ACCEPT
              : NodeFilter.FILTER_REJECT;
          },
        });
        let remaining = limit;
        const ranges = [];
        let node = walker.nextNode();

        while (node && remaining > 0) {
          const length = Math.min(node.textContent.length, remaining);
          const range = document.createRange();
          range.setStart(node, 0);
          range.setEnd(node, length);
          ranges.push(range);
          remaining -= length;
          node = walker.nextNode();
        }

        ranges.forEach((range) => {
          const mark = document.createElement("mark");
          mark.dataset.countHighlight = "true";
          range.surroundContents(mark);
        });
      }

      function updateContent() {
        const caret = saveSelection(contentInput);
        highlightFirstCharacters(contentInput, highlightLimit);

        const value = contentInput.textContent.replace(/\u00a0/g, " ");
        const characterCount = getTextLength(contentInput);
        const wordCount = getWordCount(value);

        contentTotal.textContent = characterCount;
        contentInline.textContent = characterCount;
        overTotal.textContent = Math.max(0, characterCount - highlightLimit);
        wordTotal.textContent = wordCount;
        wordInline.textContent = wordCount;
        progressFill.style.setProperty(
          "--progress",
          `${Math.min(100, (characterCount / highlightLimit) * 100)}%`,
        );

        restoreSelection(contentInput, caret);
      }

      document.querySelectorAll(".toolbar button").forEach((button) => {
        button.addEventListener("click", () => {
          contentInput.focus();
          document.execCommand(
            button.dataset.command,
            false,
            button.dataset.value || null,
          );
          updateContent();
        });
      });

      titleInput.addEventListener("input", updateTitle);
      contentInput.addEventListener("input", updateContent);
      contentInput.addEventListener("paste", () => {
        requestAnimationFrame(updateContent);
      });

      updateTitle();
      updateContent();
    </script>
  </body>
</html>
