name: Paze merchant monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paze-merchant-monitor
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test collector
        run: node --test scripts/monitoring/paze.test.mjs

      - name: Collect Paze directory
        id: collect
        continue-on-error: true
        run: node scripts/monitoring/paze.mjs

      - name: Commit monitor data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/monitoring/data
          if git diff --cached --quiet; then
            echo "No monitor data changed."
          else
            git commit -m "Record Paze monitor run"
            git push
          fi

      - name: Report collector failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
